name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 1.2.0（留空则读取 package.json）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ble-helper/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --verbose

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::非法版本号: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync version to package.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Build helper & renderer
        run: npm run build:helper && npm run build:vite

      - name: Package portable (win-unpacked)
        run: npx electron-builder --dir

      - name: Package NSIS installer
        run: npx electron-builder

      - name: Zip portable build
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/BLE-Heart-Monitor-$env:VERSION-win-x64-portable.zip" -CompressionLevel Optimal

      - name: Extract changelog
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/extract-changelog.js "$VERSION" > changelog-body.md
          if ! grep -q '^__' changelog-body.md && [ -s changelog-body.md ]; then
            {
              echo "body<<CHANGELOG_EOF"
              cat changelog-body.md
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        shell: bash
        run: ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BLE Heart Monitor ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.yml
          fail_on_unmatched_files: false
